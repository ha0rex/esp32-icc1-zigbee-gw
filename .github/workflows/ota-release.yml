name: OTA publish

# Build firmware and publish raw artifacts for the portal:
#   main  → branch ota          (Stable)
#   dev   → branch ota-nightly  (Nightly)
#
# Manifests:
#   https://raw.githubusercontent.com/ha0rex/esp32-icc1-zigbee-gw/ota/manifest.json
#   https://raw.githubusercontent.com/ha0rex/esp32-icc1-zigbee-gw/ota-nightly/manifest.json

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "README.md"
      - ".cursor/**"
      - ".gitignore"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Channel
        id: ch
        run: |
          REF="${GITHUB_REF_NAME}"
          if [ "$REF" = "main" ]; then
            echo "branch=ota" >> "$GITHUB_OUTPUT"
            echo "label=Stable" >> "$GITHUB_OUTPUT"
            echo "tag=ota" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "branch=ota-nightly" >> "$GITHUB_OUTPUT"
            echo "label=Nightly" >> "$GITHUB_OUTPUT"
            echo "tag=ota-nightly" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Source=$REF → publish branch from outputs"

      - name: Version stamp
        id: ver
        run: |
          BASE=$(grep -E 'set\(PROJECT_VER' CMakeLists.txt | sed -E 's/.*"([^"]+)".*/\1/')
          SHA=$(git rev-parse --short=8 HEAD)
          DAY=$(date -u +%Y%m%d)
          VER="${BASE}-${DAY}.${SHA}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "OTA version: $VER (${{ steps.ch.outputs.label }})"
          sed -i -E "s/set\(PROJECT_VER \"[^\"]+\"\)/set(PROJECT_VER \"$VER\")/" CMakeLists.txt

      - name: Build (ESP-IDF)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: latest
          target: esp32c3
          path: .
          command: idf.py build

      - name: Package artifacts
        run: |
          mkdir -p dist
          BIN=build/esp32_icc1_zigbee_gw.bin
          test -f "$BIN"
          cp "$BIN" dist/esp32_icc1_zigbee_gw.bin
          SHA256=$(sha256sum "$BIN" | awk '{print $1}')
          VER="${{ steps.ver.outputs.version }}"
          OTA_BRANCH="${{ steps.ch.outputs.branch }}"
          RAW_BIN="https://raw.githubusercontent.com/ha0rex/esp32-icc1-zigbee-gw/${OTA_BRANCH}/esp32_icc1_zigbee_gw.bin"
          python3 - <<PY
          import json, subprocess, datetime
          ver = "${VER}"
          sha = "${SHA256}"
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          manifest = {
              "version": ver,
              "url": "${RAW_BIN}",
              "sha256": sha,
              "channel": "${{ steps.ch.outputs.branch }}",
              "built": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "commit": commit,
          }
          open("dist/manifest.json", "w").write(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish OTA branch (raw URLs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OTA_BRANCH="${{ steps.ch.outputs.branch }}"
          WORK=$(mktemp -d)
          cp dist/esp32_icc1_zigbee_gw.bin dist/manifest.json "$WORK/"
          cd "$WORK"
          git init
          git checkout -b "$OTA_BRANCH"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add esp32_icc1_zigbee_gw.bin manifest.json
          git commit -m "OTA ${{ steps.ver.outputs.version }} (${{ steps.ch.outputs.label }})"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/ha0rex/esp32-icc1-zigbee-gw.git"
          git push -f origin "$OTA_BRANCH"

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ch.outputs.tag }}
          name: ${{ steps.ch.outputs.label }} firmware
          prerelease: ${{ steps.ch.outputs.prerelease }}
          make_latest: ${{ steps.ch.outputs.tag == 'ota' }}
          generate_release_notes: false
          body: |
            Rolling **${{ steps.ch.outputs.label }}** channel from `${{ github.ref_name }}`.
            Version: `${{ steps.ver.outputs.version }}`

            Manifest:
            `https://raw.githubusercontent.com/ha0rex/esp32-icc1-zigbee-gw/${{ steps.ch.outputs.branch }}/manifest.json`
          files: |
            dist/esp32_icc1_zigbee_gw.bin
            dist/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
