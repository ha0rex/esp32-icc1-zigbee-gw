name: OTA release (main)

# Build firmware on every push to main and publish a rolling GitHub Release
# tagged "ota" (manifest.json + .bin). The gateway checks:
#   https://github.com/ha0rex/esp32-icc1-zigbee-gw/releases/download/ota/manifest.json

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".cursor/**"
      - ".gitignore"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version stamp
        id: ver
        run: |
          BASE=$(grep -E 'set\(PROJECT_VER' CMakeLists.txt | sed -E 's/.*"([^"]+)".*/\1/')
          SHA=$(git rev-parse --short=8 HEAD)
          DAY=$(date -u +%Y%m%d)
          VER="${BASE}-${DAY}.${SHA}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "OTA version: $VER"
          sed -i -E "s/set\(PROJECT_VER \"[^\"]+\"\)/set(PROJECT_VER \"$VER\")/" CMakeLists.txt

      # esp_idf_version must be a real Docker Hub tag under espressif/idf
      # (e.g. latest, release-v5.5). "master" is NOT published → docker exit 125.
      - name: Build (ESP-IDF)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: latest
          target: esp32c3
          path: .
          command: idf.py build

      - name: Package artifacts
        run: |
          mkdir -p dist
          BIN=build/esp32_icc1_zigbee_gw.bin
          test -f "$BIN"
          cp "$BIN" dist/esp32_icc1_zigbee_gw.bin
          SHA256=$(sha256sum "$BIN" | awk '{print $1}')
          VER="${{ steps.ver.outputs.version }}"
          python3 - <<PY
          import json, subprocess, datetime
          ver = "${VER}"
          sha = "${SHA256}"
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          manifest = {
              "version": ver,
              "url": "https://github.com/ha0rex/esp32-icc1-zigbee-gw/releases/download/ota/esp32_icc1_zigbee_gw.bin",
              "sha256": sha,
              "built": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "commit": commit,
          }
          open("dist/manifest.json", "w").write(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish rolling release "ota"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota
          name: OTA channel (main)
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            Rolling firmware channel built from **main**.
            Version: `${{ steps.ver.outputs.version }}`

            The gateway System tab checks `manifest.json` on this release.
          files: |
            dist/esp32_icc1_zigbee_gw.bin
            dist/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
